plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yotakon.pesport'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yotakon.pesport'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.all {
            // Carpeta con los .bin de muestra (raiz del repositorio)
            systemProperty 'samples.dir', rootProject.file('..').absolutePath
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
