plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Firma: la misma clave en todas las compilaciones para que el APK nuevo se instale encima del
// anterior. La clave no está en el repositorio: GitHub Actions la saca de los secretos del repo
// y la pasa con estas variables de entorno. Sin ellas (compilación local) se firma con la clave
// de depuración del equipo.
def signingStore = System.getenv('SIGNING_STORE_FILE')
def signingPassword = System.getenv('SIGNING_STORE_PASSWORD')
def hasReleaseKey = signingStore && signingPassword && file(signingStore).exists()

android {
    namespace 'com.yotakon.pesport'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yotakon.pesport'
        minSdk 21
        targetSdk 34
        // Cada compilación de GitHub Actions sube el número (VERSION_CODE = 100 + nº de ejecución).
        versionCode((System.getenv('VERSION_CODE') ?: '5') as int)
        versionName '2.0'
        vectorDrawables.useSupportLibrary true
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(signingStore)
                storePassword signingPassword
                keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'pesport'
                keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: signingPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.all {
            // Carpeta con los .bin de muestra (raiz del repositorio)
            systemProperty 'samples.dir', rootProject.file('..').absolutePath
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation 'junit:junit:4.13.2'
}
