name: App Android

on:
  push:
    branches: [app-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Referencias Python al dia
        run: |
          python3 tools/gen_referencias.py
          git diff --exit-code tests/referencia

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pruebas del conversor
        run: gradle -p android testDebugUnitTest --stacktrace

      - name: Compilar APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Publicar APK (enlace directo)
        if: github.ref == 'refs/heads/app-android'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PESFaceConverter.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima PESFaceConverter.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "PES Face Converter (ultima compilacion)" \
            --notes "APK de prueba compilado automaticamente desde la rama app-android ($GITHUB_SHA)."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-y-reportes
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
          if-no-files-found: ignore
